apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agb
  namespace: agb
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - agb.abyssworks.dev
      secretName: agb-tls
  rules:
    - host: agb.abyssworks.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agb-host
                port:
                  number: 8420
