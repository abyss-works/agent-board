# PostgreSQL 17 + pgvector + PGroonga configuration
# Both pgroonga_crash_safer and pgroonga_wal_resource_manager must be preloaded
# when pgroonga.enable_wal_resource_manager = on.

listen_addresses = '*'
max_connections = 50
shared_buffers = 128MB
work_mem = 8MB
maintenance_work_mem = 64MB
effective_cache_size = 256MB

# PGroonga crash safety and WAL resource manager
shared_preload_libraries = 'pgroonga_crash_safer,pgroonga_wal_resource_manager'
max_worker_processes = 16
pgroonga.enable_crash_safe = on
pgroonga.enable_wal_resource_manager = on
# Keep legacy pgroonga.enable_wal off when pgroonga_wal_resource_manager is enabled
pgroonga.enable_wal = off
pgroonga.log_type = 'postgresql'
pgroonga_crash_safer.log_level = 'info'
pgroonga_wal_resource_manager.log_level = 'info'
