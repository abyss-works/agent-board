name: deploy

# Runs only for pushes to main and manual runs. Never add a pull_request or
# pull_request_target trigger: the deploy job runs on a self-hosted runner.
#
# Deployment builds a linux/amd64 container image on GitHub-hosted runners,
# pushes it to GHCR, and then invokes deploy-agb.sh on the hs self-hosted runner.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go test ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # web/package.json names no package manager, so the pnpm version is fixed here.
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.20.0 --activate
      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Typecheck web
        working-directory: web
        run: pnpm typecheck
      - name: Lint web
        working-directory: web
        run: pnpm lint
      - name: Test web
        working-directory: web
        run: pnpm test
      - name: Build web
        working-directory: web
        run: pnpm build

  image:
    # A manual run from another branch must not publish the main tag.
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/abyss-works/agent-board
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and push
        run: |
          tag="git-${GITHUB_SHA::7}"
          # Use the latest release commit title vX.Y.Z in git history so follow-up CI commits keep the current release.
          release="$(git log --format=%s | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
          docker build --platform linux/amd64 --build-arg "VERSION=${tag}" --build-arg "RELEASE=${release}" -t "${IMAGE}:${tag}" -t "${IMAGE}:main" .
          docker push "${IMAGE}:${tag}"
          docker push "${IMAGE}:main"
      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io

  deploy:
    # A manual run from another branch must not reach production.
    if: github.ref == 'refs/heads/main'
    needs: image
    runs-on: [self-hosted, hs-agb]
    environment: production
    permissions:
      contents: read
    steps:
      - name: Deploy to hs via docker compose
        run: /home/ubuntu/workspaces/wsk0715/homeserver/infra/scripts/deploy-agb.sh "git-${GITHUB_SHA::7}"
