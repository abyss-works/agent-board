name: deploy

# Runs only for pushes to main and manual runs. Never add a pull_request or
# pull_request_target trigger: the deploy job runs on a self-hosted runner.
#
# Deployment is GitOps: the workflow never applies manifests to the cluster.
# Argo CD watches k8s/prod on main, so the deploy job commits the new image tag
# to k8s/prod/deployment.yaml and pushes it; Argo CD then rolls the pod out.
# The push uses GITHUB_TOKEN, and pushes made with that token do not start
# another workflow run. The deploy job also skips bot commits and [skip ci]
# commits as a second guard against triggering itself.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go test ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # web/package.json names no package manager, so the pnpm version is fixed here.
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.20.0 --activate
      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Typecheck web
        working-directory: web
        run: pnpm typecheck
      - name: Lint web
        working-directory: web
        run: pnpm lint
      - name: Test web
        working-directory: web
        run: pnpm test
      - name: Build web
        working-directory: web
        run: pnpm build

  image:
    # A manual run from another branch must not publish the main tag.
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/abyss-works/agent-board
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and push
        run: |
          tag="git-${GITHUB_SHA::7}"
          # A release merge commit is titled vX.Y.Z; any other commit builds without a release.
          release=""
          subject="$(git log -1 --format=%s)"
          if printf '%s' "$subject" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            release="$subject"
          fi
          docker build --platform linux/arm64 --build-arg "VERSION=${tag}" --build-arg "RELEASE=${release}" -t "${IMAGE}:${tag}" -t "${IMAGE}:main" .
          docker push "${IMAGE}:${tag}"
          docker push "${IMAGE}:main"
      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io

  deploy:
    # A manual run from another branch must not reach production. Bot commits
    # and [skip ci] commits are the manifest tag commits, so skip them here too.
    if: >-
      github.ref == 'refs/heads/main' &&
      !(github.event.head_commit.author.username == 'github-actions[bot]' ||
        contains(github.event.head_commit.message, '[skip ci]'))
    needs: image
    runs-on: [self-hosted, ab]
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Point the manifest at the new image
        run: |
          tag="git-${GITHUB_SHA::7}"
          manifest="k8s/prod/deployment.yaml"
          sed -i "s|^\( *\)image: ghcr.io/abyss-works/agent-board:.*$|\1image: ghcr.io/abyss-works/agent-board:${tag}|" "$manifest"
          if git diff --quiet -- "$manifest"; then
            echo "manifest already points at ${tag}; nothing to commit"
            exit 0
          fi
          # Push as the bot so GITHUB_TOKEN can write to the protected branch.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$manifest"
          git commit -m "chore(deploy): agb 이미지 태그를 ${tag}로 올린다 [skip ci]"
          if ! git push origin HEAD:main; then
            echo "::error::failed to push the manifest commit to main; main branch protection must allow pushes from github-actions[bot]" >&2
            exit 1
          fi
      - name: Check health
        run: |
          tag="git-${GITHUB_SHA::7}"
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT

          # Argo CD syncs the manifest commit, so allow several minutes for the new pod.
          check() {
            local url="$1" code=""
            for _ in $(seq 1 60); do
              code="$(curl -sS --max-time 5 -o "$body" -w '%{http_code}' "$url" 2>/dev/null || true)"
              if [ "$code" = 200 ] && grep -Eq "\"version\":\"[^\"]*${tag}" "$body"; then
                echo "ok: $url"
                cat "$body"
                return 0
              fi
              sleep 5
            done
            echo "health check failed: $url (last status: ${code:-none}, expected version containing ${tag})" >&2
            return 1
          }

          check "https://agb.abyssworks.dev/v1/health"
