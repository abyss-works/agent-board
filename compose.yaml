name: agent-board

services:
  pg:
    build:
      context: ./deploy/pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AGB_PG_DB:-agb}
      POSTGRES_USER: ${AGB_PG_USER:-agb}
      POSTGRES_PASSWORD: ${AGB_PG_PASSWORD:?AGB_PG_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pg-data:/var/lib/postgresql/data

  agb:
    build:
      context: .
      args:
        VERSION: ${AGB_VERSION:-dev}
    restart: unless-stopped
    ports:
      # Transitional fallback for local runs. Bind to all host addresses by default; narrow it with AGB_BIND.
      - "${AGB_BIND:-0.0.0.0}:${AGB_PORT:-3000}:3000"
    environment:
      AGB_TOKEN: ${AGB_TOKEN:?AGB_TOKEN is required}
      AGB_ACTORS: ${AGB_ACTORS:?AGB_ACTORS is required}
      AGB_DATABASE_URL: ${AGB_DATABASE_URL:-}
      AGB_DB_MAX_CONNS: ${AGB_DB_MAX_CONNS:-}
      AGB_BACKUP_BUCKET: ${AGB_BACKUP_BUCKET:-}
      AGB_BACKUP_ENDPOINT: ${AGB_BACKUP_ENDPOINT:-}
      AGB_BACKUP_ACCESS_KEY_ID: ${AGB_BACKUP_ACCESS_KEY_ID:-}
      AGB_BACKUP_SECRET_ACCESS_KEY: ${AGB_BACKUP_SECRET_ACCESS_KEY:-}
      AGB_EMBEDDING_API_KEY: ${AGB_EMBEDDING_API_KEY:-}
      AGB_EMBEDDING_URL: ${AGB_EMBEDDING_URL:-}
      AGB_EMBEDDING_MODEL: ${AGB_EMBEDDING_MODEL:-}
      AGB_EMBEDDING_QUERY_PREFIX: ${AGB_EMBEDDING_QUERY_PREFIX:-}
      AGB_EMBEDDING_INTERVAL: ${AGB_EMBEDDING_INTERVAL:-}
      AGB_EMBEDDING_QUERY_TIMEOUT: ${AGB_EMBEDDING_QUERY_TIMEOUT:-}
      AGB_EMBEDDING_PROVIDER: ${AGB_EMBEDDING_PROVIDER:-}
    volumes:
      - agb-data:/data

volumes:
  agb-data:
  pg-data:
