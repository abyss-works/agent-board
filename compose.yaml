name: agent-board

services:
  agb:
    build:
      context: .
      args:
        VERSION: ${AGB_VERSION:-dev}
    restart: unless-stopped
    ports:
      # Bind to a single host address (loopback for local use, the address of the network interface the clients reach on a server).
      - "${AGB_BIND:-127.0.0.1}:${AGB_PORT:-8420}:8420"
    environment:
      AGB_TOKEN: ${AGB_TOKEN:?AGB_TOKEN is required}
      AGB_ACTORS: ${AGB_ACTORS:?AGB_ACTORS is required}
      AGB_BACKUP_BUCKET: ${AGB_BACKUP_BUCKET:-}
      AGB_BACKUP_ENDPOINT: ${AGB_BACKUP_ENDPOINT:-}
      AGB_BACKUP_ACCESS_KEY_ID: ${AGB_BACKUP_ACCESS_KEY_ID:-}
      AGB_BACKUP_SECRET_ACCESS_KEY: ${AGB_BACKUP_SECRET_ACCESS_KEY:-}
      AGB_EMBEDDING_API_KEY: ${AGB_EMBEDDING_API_KEY:-}
      AGB_EMBEDDING_URL: ${AGB_EMBEDDING_URL:-}
      AGB_EMBEDDING_MODEL: ${AGB_EMBEDDING_MODEL:-}
      AGB_EMBEDDING_QUERY_PREFIX: ${AGB_EMBEDDING_QUERY_PREFIX:-}
      AGB_EMBEDDING_INTERVAL: ${AGB_EMBEDDING_INTERVAL:-}
    volumes:
      - agb-data:/data

volumes:
  agb-data:
